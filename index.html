function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

}

function pack(S,scale,list,seed){
  const rnd=mulberry32(seed);
  const s=S/2.34, cx=S/2, cy=S/2, yc=.12;

  const inside=(px,py)=>{
    let x=(px-cx)/s, y=(cy-py)/s+yc;
    x*=1.045; y=(y-.15)*1.045+.15;
    const a=x*x+y*y-1;
    return a*a*a-x*x*y*y*y<=0;
  };

    return inside(x,y)&&inside(x-hw,y-hh)&&inside(x+hw,y-hh)&&inside(x-hw,y+hh)&&inside(x+hw,y+hh)&&
      inside(x,y-hh)&&inside(x,y+hh)&&inside(x-hw,y)&&inside(x+hw,y)&&
      inside(x-hw/2,y-hh)&&inside(x+hw/2,y-hh)&&inside(x-hw/2,y+hh)&&inside(x+hw/2,y+hh);
  };
  const free=(x,y,w,h,g)=>{
    for(let i=0;i<placed.length;i++){
      const p=placed[i];
      if(Math.abs(x-p.x)<(w+p.w)/2+g&&Math.abs(y-p.y)<(h+p.h)/2+g)return false;
    }
    return true;
  };
  const x0=cx-1.15*s,x1=cx+1.15*s,y0=cy-1.13*s,y1=cy+1.13*s;

  function tryPlace(entry,fs,tries){
    const text=entry[0];
    const w=measure(text,fs)*1.04+2, h=fs*(TALL.test(text)?1.7:1.28);
    const g=Math.max(1.5,fs*.1);
    for(let i=0;i<tries;i++){
      const x=x0+rnd()*(x1-x0), y=y0+rnd()*(y1-y0);
      if(!fits(x,y,w,h)||!free(x,y,w,h,g))continue;
      const it={x,y,w,h,fs,text,lang:entry[1],name:entry[2]};
      placed.push(it);
      return it;
    }
    return null;
  }

  let uniq=0;
  // 1) اللغات الأساسية بخط كبير
  list.slice(0,10).forEach((e,i)=>{
    let ok=null;
    for(let t=(i<6?0:1);t<tiers.length&&!ok;t++) ok=tryPlace(e,tiers[t],260);
    if(ok)uniq++;
  });
  // 2) بقية اللغات
  const rest=shuffle(list.slice(10),rnd);
  rest.forEach(e=>{
    let ok=null;
    for(let t=1+((rnd()*2)|0);t<tiers.length&&!ok;t++) ok=tryPlace(e,tiers[t],120);
    if(!ok) ok=tryPlace(e,tiers[tiers.length-1],500);
    if(ok)uniq++;
  });
  // 3) ملء الفراغات الصغيرة بكلمات وزخارف
  let fails=0;
  while(fails<260&&placed.length<430){
    const sym=rnd()<.28;
    const e=sym?[SYMS[(rnd()*SYMS.length)|0],'','']:list[(rnd()*list.length)|0];
    const t=Math.min(5,3+((rnd()*3)|0));
    const it=tryPlace(e,tiers[t]*(sym?1.15:1),14);
    if(it)fails=0;else fails++;
  }
  return {placed,uniq};
}

/* ───────── بناء القلب في الصفحة ───────── */
let words=[], builtS=0, built=false;

function build(){
  const S=stage.clientWidth;
  if(!S)return;
  builtS=S;
  const list=LANGS.slice(0,S<420?92:S<640?108:LANGS.length);
  let res,scale=S<420?.94:1;
  for(let i=0;i<7;i++){
    res=pack(S,scale,list,7);
    if(res.uniq>=list.length-1)break;
    scale*=.92;
  }
  render(res.placed,S);
  built=true;
}

function render(items,S){
  heart.textContent='';
  words=[];
  const frag=document.createDocumentFragment();
  const rnd=mulberry32(99);
  items.forEach(it=>{
    const el=document.createElement('span');
    el.className='w';
    el.textContent=it.text;
    el.dir='auto';
    if(it.lang)el.lang=it.lang;
    el.style.cssText='left:'+(it.x-it.w/2).toFixed(1)+'px;top:'+(it.y-it.h/2).toFixed(1)+'px;width:'+it.w.toFixed(1)+
      'px;height:'+it.h.toFixed(1)+'px;font-size:'+it.fs.toFixed(1)+'px;line-height:'+it.h.toFixed(1)+'px;';
    if(!reduced&&rnd()<.65){
      el.classList.add('tw');
      el.style.setProperty('--td',(2.6+rnd()*4).toFixed(2)+'s');
      el.style.setProperty('--dl',(-rnd()*6).toFixed(2)+'s');
    }
    let t=(it.x/S)*.5+(it.y/S)*.5+(rnd()-.5)*.55;
    t=((t%1)+1)%1;
    it.ci=Math.floor(t*8);
    it.el=el; el._it=it;
    if(!reduced&&el.animate){
      el.animate([{opacity:0,scale:.5},{opacity:1,scale:1}],{duration:750,delay:rnd()*1000,fill:'backwards',easing:'ease-out'});
    }
    frag.appendChild(el);
    words.push(it);
  });
  heart.appendChild(frag);
  colorize();
}

function colorize(){
  const pal=THEMES[themeIdx].words;
  words.forEach(it=>{it.el.style.color=pal[it.ci%pal.length];});
}

/* ───────── التلميح (اسم اللغة) ───────── */
let hintTimer=0;
function resetHint(){hint.classList.remove('hot');hint.textContent=HINT;}
function showName(it){
  clearTimeout(hintTimer);
  hint.classList.add('hot');
  hint.textContent='';
  const b=document.createElement('bdi');
  b.textContent='«'+it.text+'»';
  hint.append(b,' — '+it.name);
}
heart.addEventListener('pointerover',e=>{
  const el=e.target.closest&&e.target.closest('.w');
  if(el&&el._it&&el._it.name)showName(el._it);
});
heart.addEventListener('pointerout',e=>{
  clearTimeout(hintTimer);
  hintTimer=setTimeout(resetHint,e.pointerType==='mouse'?250:2200);
});

/* ───────── النجوم في الخلفية ───────── */
let SW=innerWidth,SH=innerHeight,dpr=1;
let stars=[],shoot=null,nextShoot=3000;

function sparkle(c,x,y,s){
  const k=s*.16;
  c.beginPath();c.moveTo(x,y-s);
  c.quadraticCurveTo(x+k,y-k,x+s,y);
  c.quadraticCurveTo(x+k,y+k,x,y+s);
  c.quadraticCurveTo(x-k,y+k,x-s,y);
  c.quadraticCurveTo(x-k,y-k,x,y-s);
  c.closePath();
}
function heartPath(c,s){
  c.beginPath();c.moveTo(0,s*.9);
  c.bezierCurveTo(-s*1.35,s*.1,-s*1.05,-s*.95,0,-s*.4);
  c.bezierCurveTo(s*1.05,-s*.95,s*1.35,s*.1,0,s*.9);
  c.closePath();
}
function sizeCanvases(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  SW=innerWidth;SH=innerHeight;
  [starCv,fxCv].forEach(c=>{c.width=Math.round(SW*dpr);c.height=Math.round(SH*dpr);});
  sctx.setTransform(dpr,0,0,dpr,0,0);
  fx.setTransform(dpr,0,0,dpr,0,0);
}
function initStars(){
  const n=Math.max(90,Math.min(260,Math.round(SW*SH/5500)));
  stars=[];
  for(let i=0;i<n;i++){
    stars.push({x:Math.random(),y:Math.random(),r:.4+Math.pow(Math.random(),3)*1.9,
      tw:Math.random()*6.283,sp:.5+Math.random()*1.6,v:2+Math.random()*7,ci:(Math.random()*5)|0});
  }
}
function drawStars(t,dt){
  sctx.clearRect(0,0,SW,SH);
  const cols=THEMES[themeIdx].stars;
  for(const st of stars){
    if(!reduced){
      st.y-=st.v*dt/SH; if(st.y<-.02)st.y=1.02;
      st.x+=Math.sin(t/4000+st.tw)*.00002;
    }
    const a=reduced?.8:.35+.65*(.5+.5*Math.sin(t/1000*st.sp+st.tw));
    const x=st.x*SW,y=st.y*SH;
    sctx.globalAlpha=a;
    sctx.fillStyle=cols[st.ci%cols.length];
    if(st.r>1.55){
      sctx.shadowColor=sctx.fillStyle;sctx.shadowBlur=8;
      sparkle(sctx,x,y,st.r*3.2);sctx.fill();
      sctx.shadowBlur=0;
    }else{
      sctx.beginPath();sctx.arc(x,y,st.r,0,6.283);sctx.fill();
    }
  }
  sctx.globalAlpha=1;
  if(!reduced){
    if(!shoot&&t>nextShoot){
      shoot={x:SW*.2+Math.random()*SW*.8,y:Math.random()*SH*.4,vx:-(380+Math.random()*200),vy:220+Math.random()*120,life:0,max:.9};
    }
    if(shoot){
      shoot.life+=dt;shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;
      const k=1-shoot.life/shoot.max;
      const tx=shoot.x-shoot.vx*.14,ty=shoot.y-shoot.vy*.14;
      const g=sctx.createLinearGradient(shoot.x,shoot.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+Math.max(0,k)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      sctx.strokeStyle=g;sctx.lineWidth=1.8;sctx.lineCap='round';
      sctx.beginPath();sctx.moveTo(shoot.x,shoot.y);sctx.lineTo(tx,ty);sctx.stroke();
      if(shoot.life>shoot.max){shoot=null;nextShoot=t+5000+Math.random()*7000;}
    }
  }
}

/* ───────── انفجار القلوب والنجوم ───────── */
const parts=[];
function burst(x,y,count){
  const th=THEMES[themeIdx].burst;
  const n=count||(reduced?10:44);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const sp=(reduced?40:90)+Math.random()*(reduced?60:260);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:0,
      max:(reduced?.7:1.1)+Math.random()*.9,s:5+Math.random()*9,r:Math.random()*6.283,
      vr:(Math.random()-.5)*4,type:Math.random()<.55?'h':'s',c:th[(Math.random()*th.length)|0]});
  }
  kick();
}
function drawFx(dt){
  fx.clearRect(0,0,SW,SH);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life+=dt;
    if(p.life>=p.max){parts.splice(i,1);continue;}
    const k=1-p.life/p.max;
    const drag=Math.max(0,1-2.4*dt);
    p.vx*=drag;p.vy=p.vy*drag-30*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
    fx.save();
    fx.translate(p.x,p.y);
    fx.globalAlpha=Math.min(1,k*1.6);
    fx.fillStyle=p.c;fx.shadowColor=p.c;fx.shadowBlur=12;
    const sz=p.s*(.6+.4*k);
    if(p.type==='h'){fx.rotate(Math.sin(p.r)*.4);heartPath(fx,sz*.55);}
    else{fx.rotate(p.r);sparkle(fx,0,0,sz);}
    fx.fill();
    fx.restore();
  }
}

let raf=0,last=0;
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}}
function frame(t){
  raf=0;
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!reduced)drawStars(t,dt);
  drawFx(dt);
  if(!reduced||parts.length)raf=requestAnimationFrame(frame);
}

/* ───────── التفاعل مع القلب ───────── */
function wave(cx,cy){
  if(reduced)return;
  const r=stage.getBoundingClientRect();
  const ox=cx-r.left,oy=cy-r.top;
  words.forEach(it=>{
    if(!it.el.animate)return;
    const d=Math.hypot(it.x-ox,it.y-oy);
    it.el.animate([
      {scale:1,filter:'brightness(1)'},
      {scale:1.55,filter:'brightness(1.8)',offset:.4},
      {scale:1,filter:'brightness(1)'}
    ],{duration:650,delay:d*1.1,easing:'ease-in-out'});
  });
}
function beat(){
  if(reduced||!stage.animate)return;
  stage.animate([{transform:'scale(1)'},{transform:'scale(1.06)',offset:.3},{transform:'scale(1)'}],{duration:520,easing:'ease-out'});
}
function celebrate(x,y){burst(x,y);wave(x,y);beat();}
stage.addEventListener('pointerdown',e=>{if(e.button>0)return;celebrate(e.clientX,e.clientY);});
stage.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    const r=stage.getBoundingClientRect();
    celebrate(r.left+r.width/2,r.top+r.height/2);
  }
});

/* ───────── الثيمات ───────── */
function applyTheme(i){
  themeIdx=i;
  const th=THEMES[i];
  document.body.dataset.theme=th.id;
  $('themeLbl').textContent=th.name;
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',th.bg);
  colorize();
  if(reduced)drawStars(0,0);
  try{localStorage.setItem('love-theme',String(i));}catch(e){}
}
$('theme').addEventListener('click',e=>{
  applyTheme((themeIdx+1)%THEMES.length);
  const r=e.currentTarget.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2,16);
});

/* ───────── الموسيقى (تُولَّد بالكود — لا ملفات صوت) ───────── */
const Music=(()=>{
  let ctx=null,master=null,timer=0,beatN=0,nextT=0,on=false;
  const BEAT=.8;
  const CH=[
    {pad:[220,261.63,329.63],bass:110,arp:[440,523.25,659.25,880]},
    {pad:[174.61,220,261.63],bass:87.31,arp:[349.23,440,523.25,698.46]},
    {pad:[261.63,329.63,392],bass:130.81,arp:[523.25,659.25,784,1046.5]},
    {pad:[196,246.94,293.66],bass:98,arp:[392,493.88,587.33,784]}
  ];
  const PAT=[0,2,1,3,2,1,3,2];
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)throw new Error('no-audio');
    ctx=new AC();
    master=ctx.createGain();master.gain.value=0;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.Q.value=.3;
    const dly=ctx.createDelay(2);dly.delayTime.value=.56;
    const fb=ctx.createGain();fb.gain.value=.42;
    const wet=ctx.createGain();wet.gain.value=.38;
    const dlp=ctx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=1600;
    master.connect(lp);lp.connect(ctx.destination);
    lp.connect(dly);dly.connect(dlp);dlp.connect(fb);fb.connect(dly);
    dlp.connect(wet);wet.connect(ctx.destination);
  }
  function tone(f,t,d,v,type,atk){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type;o.frequency.value=f;o.detune.value=(Math.random()-.5)*8;
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(v,t+atk);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);
    o.start(t);o.stop(t+d+.1);
  }
  function playBeat(b,t){
    const c=CH[Math.floor(b/8)%4],i=b%8;
    if(i===0){
      c.pad.forEach(f=>tone(f,t,6.8,.05,'sine',1.6));
      tone(c.bass,t,6.4,.07,'sine',.8);
    }
    if(Math.random()<.82)tone(c.arp[PAT[i]],t,2.6,.075,'triangle',.015);
    if(i%4===2&&Math.random()<.5)tone(c.arp[PAT[i]]*2,t,2,.03,'sine',.02);
  }
  function sched(){
    while(nextT<ctx.currentTime+.8){playBeat(beatN,nextT);beatN++;nextT+=BEAT;}
  }
  return {
    get on(){return on;},
    start(){
      if(!ctx)init();
      ctx.resume();
      if(beatN===0)nextT=ctx.currentTime+.1;
      on=true;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(.85,ctx.currentTime,.5);
      clearInterval(timer);timer=setInterval(sched,200);sched();
    },
    stop(){
      on=false;clearInterval(timer);
      if(!ctx)return;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0,ctx.currentTime,.15);
      setTimeout(()=>{if(!on)ctx.suspend();},700);
    },
    pause(){if(ctx&&on)ctx.suspend();},
    resume(){if(ctx&&on)ctx.resume();}
  };
})();

const musicBtn=$('music');
function setMusicUI(){
  musicBtn.classList.toggle('on',Music.on);
  musicBtn.setAttribute('aria-pressed',String(Music.on));
  $('musicLbl').textContent=Music.on?'إيقاف الموسيقى':'تشغيل الموسيقى';
}
musicBtn.addEventListener('click',()=>{
  try{
    if(Music.on)Music.stop();else Music.start();
  }catch(e){
    musicBtn.disabled=true;
    $('musicLbl').textContent='الصوت غير مدعوم';
  }
  setMusicUI();
});
document.addEventListener('visibilitychange',()=>{document.hidden?Music.pause():Music.resume();});

/* ───────── الإقلاع ───────── */
const ALLTXT=LANGS.map(l=>l[0]).join('')+SYMS.join('');
async function fontsReady(){
  const link=$('gfonts');
  const cssReady=new Promise(res=>{
    if(!link||link.sheet){res();return;}
    link.addEventListener('load',res,{once:true});
    link.addEventListener('error',res,{once:true});
  });
  await Promise.race([cssReady,sleep(2500)]);
  if(document.fonts&&document.fonts.load){
    try{
      await Promise.race([Promise.all([
        document.fonts.load('600 16px Quicksand',ALLTXT),
        document.fonts.load('600 16px Cairo',ALLTXT),
        document.fonts.load('700 24px "Aref Ruqaa"','مهما اختلفت اللغات')
      ]),sleep(2500)]);
    }catch(e){}
  }
}

let rz=0,fd=0;
addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{
    sizeCanvases();
    if(reduced)drawStars(0,0);
    if(built&&Math.abs(stage.clientWidth-builtS)>1)build();
  },180);
});
if(document.fonts&&document.fonts.addEventListener){
  document.fonts.addEventListener('loadingdone',()=>{
    if(!built)return;
    clearTimeout(fd);fd=setTimeout(build,250);
  });
}
const onMotion=()=>{
  reduced=mq.matches;
  if(built)build();
  if(reduced){drawStars(0,0);}else{kick();}
};
if(mq.addEventListener)mq.addEventListener('change',onMotion);
else if(mq.addListener)mq.addListener(onMotion);

(async function boot(){
  applyTheme(themeIdx);
  sizeCanvases();
  initStars();
  if(reduced)drawStars(0,0);else kick();
  await fontsReady();
  build();
  setMusicUI();
})();
})();
</script>
